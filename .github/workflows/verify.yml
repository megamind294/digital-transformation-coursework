name: Verify documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required coursework files
        run: |
          test -f README.md
          test -f task-1-literature-review/README.md
          test -f task-1-literature-review/review-notes.md
          test -f task-2-uml-case-study/README.md
          test -f task-2-uml-case-study/diagrams.md
          test -f references.md
      - name: Reject unfinished placeholders
        run: |
          if grep -R -n -E '\b(TBD|TODO)\b' --include='*.md' .; then
            echo 'Unfinished placeholder found'
            exit 1
          fi
